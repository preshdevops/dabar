[workspace]
members = [
  "packages/core",
  "apps/server",
  "apps/cli",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/dabar/dabar"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
uuid = { version = "1.10", features = ["serde", "v4"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[profile.dev]
debug = 0
strip = true
